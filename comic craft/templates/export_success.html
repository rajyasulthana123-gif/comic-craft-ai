{% extends "base.html" %}


{% block title %}

Export Complete · ComicCraft

{% endblock %}


{% block content %}


<section class="card success">


    <div class="success-icon">
        ✓
    </div>


    <h1>
        Your comic is ready!
    </h1>


    <p>
        Your PDF export has been created successfully.
    </p>


    {% if pdf_path %}

    <a
        class="button"
        href="{{ pdf_path }}"
        download
    >
        Download PDF
    </a>

    {% endif %}


    <a
        class="button secondary"
        href="/"
    >
        Go Create Another Comic
    </a>


</section>

{% endblock %}
